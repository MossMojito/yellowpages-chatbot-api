# =============================================================================
# docker-compose.yml — Local full-stack development
#
# Runs both backend (Flask/gunicorn) and frontend (React/nginx) together.
# Use this LOCALLY to develop and debug — test everything before pushing to GCP.
#
# Usage:
#   cp .env.example .env          # fill in OPENAI_API_KEY
#   docker compose up --build     # first run (builds images)
#   docker compose up             # subsequent runs (faster, cached)
#   docker compose down           # stop everything
#
# Endpoints:
#   Frontend : http://localhost:3000
#   Backend  : http://localhost:5000
#   Health   : http://localhost:5000/health
# =============================================================================

services:

  # ── Backend (Flask + gunicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend # uses backend/Dockerfile
    container_name: yellowpages-backend
    ports:
      - "5001:5000" # localhost:5001 → container:5000 (avoids macOS AirPlay on 5000)
    env_file:
      - .env # reads OPENAI_API_KEY, LANGCHAIN_* etc.
    environment:
      - FLASK_ENV=development # enables debug-friendly logging
      - PORT=5000
    volumes:
      # Mount source code so code changes are visible without rebuilding.
      # gunicorn will NOT hot-reload by default; add --reload flag if needed.
      - ./backend:/app
    healthcheck:
      # python:3.11-slim has no curl — use python instead
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s # give gunicorn time to load the vectorstore

  # ── Frontend (React built by Vite, served by nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend # uses frontend/Dockerfile (multi-stage)
    container_name: yellowpages-frontend
    ports:
      - "3001:80" # localhost:3001 → nginx inside container:80
    volumes:
      # Override nginx config to proxy /api/* → backend:5000 (docker service name)
      # In K8s, frontend/nginx.conf is used (proxy target: backend-service:80)
      - ./frontend/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started # start once backend container is up (not waiting for healthcheck)

# All services share this network so "backend" hostname resolves inside frontend
networks:
  default:
    name: yellowpages-local
