server {
    listen 80;
    server_name _;

    # Root directory — where Vite puts the build output
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router uses client-side routing. Any path not matched by a real
    # file should fall back to index.html so React can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # In production all /api/* requests are forwarded to the backend K8s service.
    # The service name "backend-service" is resolved by K8s internal DNS.
    location /api/ {
        proxy_pass         http://backend-service:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite fingerprints JS/CSS filenames with a hash, so they can be cached
    # for a long time safely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
